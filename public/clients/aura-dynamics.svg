<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C6FF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <g transform="translate(10, 15)">
    <!-- Icon -->
    <g transform="translate(10, 5)">
      <circle cx="40" cy="40" r="32" fill="none" stroke="url(#auraGrad)" stroke-width="6" opacity="0.4"/>
      <circle cx="52" cy="40" r="24" fill="none" stroke="url(#auraGrad)" stroke-dasharray="8 4" stroke-width="4"/>
      <circle cx="40" cy="40" r="14" fill="url(#auraGrad)"/>
    </g>
    <!-- Text -->
    <text x="120" y="48" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="4">AURA</text>
    <text x="120" y="76" font-family="'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="url(#auraGrad)" letter-spacing="7">DYNAMICS</text>
  </g>
</svg>
